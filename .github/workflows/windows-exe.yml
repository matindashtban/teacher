name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Bundle native file bridge used by the shared HTML
        run: npm run bundle:native

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: daftar-kelas-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
