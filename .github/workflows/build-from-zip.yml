name: Build Android APK from uploaded ZIP

on:
  push:
    branches: [main]
    paths:
      - 'daftar-kelas-vite-react-github-actions.zip'
      - '.github/workflows/build-from-zip.yml'
      - '.github/scripts/patch-png-export.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          test -f daftar-kelas-vite-react-github-actions.zip
          mkdir -p /tmp/daftar-kelas
          unzip -q daftar-kelas-vite-react-github-actions.zip -d /tmp/daftar-kelas
          PACKAGE_FILE="$(find /tmp/daftar-kelas -name package.json -print -quit)"
          test -n "$PACKAGE_FILE"
          PROJECT_ROOT="$(dirname "$PACKAGE_FILE")"
          cp -a "$PROJECT_ROOT"/. .
      - name: Fix PNG sharing for Android WebView
        run: python3 .github/scripts/patch-png-export.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daftar-kelas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
